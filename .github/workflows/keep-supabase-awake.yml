# Free Supabase projects pause after a week with no activity. This job touches the
# database twice a week so that never happens. Configure one of these pairs first:
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  your publishable (or anon) key
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 * * 1,4" # every Monday and Thursday, 06:00 UTC
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping the database
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY must be configured as repository secrets or variables."
            exit 1
          fi

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
