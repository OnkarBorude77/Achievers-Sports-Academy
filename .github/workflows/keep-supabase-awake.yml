# Free Supabase projects pause after a week with no activity. This job touches the
# database twice a week so that never happens. Add two repository secrets first:
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  your publishable (or anon) key
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 * * 1,4" # every Monday and Thursday, 06:00 UTC
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
